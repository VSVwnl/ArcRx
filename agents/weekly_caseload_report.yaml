# weekly_caseload_report — run protocol and offline fallback plan
# Canonical definition: informer.yaml → agents.weekly_caseload_report (cron "0 7 * * 1").
name: weekly_caseload_report
trigger: cron 0 7 * * 1
tools: [summarize_caseload, create_alert]

protocol:
  - Summarise every patient (status, % of target, adherence).
  - Adherence < 60% of prescribed sessions → low "adherence" outreach alert.
  - Produce a digest grouped by status.

fallback:
  steps:
    - tool: summarize_caseload
      as: caseload
      args: {}

    - forEach: caseload.patients
      as: p
      when: { path: p.adherence, lt: 60 }
      tool: create_alert
      args:
        patient_id: $p.patient_id
        severity: low
        kind: adherence
        title: "{p.sessions_7d} of {p.prescribed_per_week} sessions this week"
        body: "Weekly digest flagged adherence at {p.adherence}%. Suggested: a short check-in message and confirm the home setup still works."

  summary: "Weekly digest — regression: {caseload.counts.regression}, plateau: {caseload.counts.plateau}, low adherence: {caseload.counts.non_adherent}, ready to progress: {caseload.counts.ready_to_progress}, on track: {caseload.counts.on_track}"
